<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>BEDYO</title>

<link rel="stylesheet" href="main.css">

</head><body><!-- =====================================
     BEDYO SPLASH
===================================== --><div id="splashScreen" class="splash-screen"><div class="splash-glow"></div>

<div class="splash-logo">

    <div class="splash-play">
        ▶
    </div>

    <div class="splash-name">
        BEDYO
    </div>

</div>

<div class="splash-line"></div>

</div><!-- =====================================
     MAIN APP
===================================== --><div id="mainApp" class="main-app"><header class="topbar"><div class="brand">

    <div class="brand-icon">
        B
    </div>

    <span>
        BEDYO
    </span>

</div>


<div class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="Search"
        autocomplete="off"
    >

    <button
        id="searchButton"
        type="button"
    >
        🔍
    </button>

</div>

</header><main><!-- PLAYER --><section
    id="playerPanel"
    class="player-panel"
><video
    id="videoPlayer"
    controls
    playsinline
    preload="metadata"
></video>


<div class="player-info">

    <h1 id="videoTitle">
        Select a video
    </h1>

    <div id="videoDetails">
        BEDYO
    </div>

</div>

</section><!-- VIDEO HEADER --><div class="section-header"><h2>
    Videos
</h2>

<span id="videoCount">
    0 videos
</span>

</div><!-- LOADING --><div
    id="loading"
    class="loading"
>
    Loading videos...
</div><!-- ERROR --><div
    id="errorMessage"
    class="error-message"
></div><!-- GALLERY --><section
    id="videoGallery"
    class="video-gallery"
></section></main></div><script src="main.js"></script></body></html>
