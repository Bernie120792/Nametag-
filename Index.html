<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bunny Videos</title>

<link rel="stylesheet" href="main.css">
</head>

<body>

<header class="header">
    <div class="logo">Videos</div>

    <div class="searchBox">
        <input
            type="search"
            id="searchInput"
            placeholder="Search videos..."
            autocomplete="off"
        >
    </div>
</header>

<main class="main">

    <div id="loading" class="loading">
        Loading videos...
    </div>

    <div id="error" class="error hidden"></div>

    <div id="videoGrid" class="videoGrid"></div>

    <button id="loadMoreBtn" class="loadMore hidden">
        LOAD MORE
    </button>

</main>


<!-- VIDEO PLAYER -->
<div id="playerScreen" class="playerScreen hidden">

    <button id="closePlayer" class="closePlayer">
        ×
    </button>

    <div class="playerContainer">

        <!-- ISANG IFRAME LANG -->
        <iframe
            id="player"
            src=""
            allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen"
            allowfullscreen>
        </iframe>

    </div>

</div>


<script src="main.js"></script>

</body>
  </html>
